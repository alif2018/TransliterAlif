<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transliterasi Alif</title>
  <link rel="stylesheet" href="home.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  
  <!-- HEADER BIRU -->
  <div id="content-header">
    <div class="padding">
      <h1>Transliterasi Alif</h1>
    </div>
  </div>

  <!-- KONTEN UTAMA -->
  <div id="content-main">
    <div class="padding">
      <p class="instruction">Tekan tombol Transliterasi untuk menulis</p>
      
      <!-- GRID TOMBOL KARAKTER -->
      <div class="button-grid">
        <button id="a1">Ā</button> <button id="a2">ā</button> 
        <button id="i1">Ī</button> <button id="i2">ī</button> 
        <button id="u1">Ū</button> <button id="u2">ū</button>
        
        <button id="d1">Ḍ</button> <button id="d2">ḍ</button> 
        <button id="g1">Ġ</button> <button id="g2">ġ</button> 
        <button id="h1">Ḥ</button> <button id="h2">ḥ</button>
        
        <button id="s1">Ṡ</button> <button id="s2">ṡ</button> 
        <button id="s3">Ṣ</button> <button id="s4">ṣ</button> 
        <button id="t1">Ṭ</button> <button id="t2">ṭ</button>
        
        <button id="z1">Ż</button> <button id="z2">ż</button> 
        <button id="z3">Ẓ</button> <button id="z4">ẓ</button> 
        <button id="ain">ʿ</button> <button id="hamzah">ʾ</button>      </div>

      <!-- GRID TOMBOL AKSI (Spasi, Backspace, Del) -->
<!-- GRID TOMBOL AKSI (Spasi, Enter, Backspace, Del) -->
<div class="action-grid">
  <button id="btn-space" class="action-btn">Spasi</button>
  <button id="btn-enter" class="action-btn">Enter</button>
  <button id="btn-backspace" class="action-btn">Backspace</button>
  <button id="btn-del" class="action-btn">Del</button>
</div>
    </div>
  </div>
  
  <!-- FOOTER / STATUS -->
  <div id="supportedVersion"></div>
  
  <!-- SCRIPT -->
  <script src="home.js"></script>
</body>
</html>
